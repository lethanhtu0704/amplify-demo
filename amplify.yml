version: 1
# Static export variant (branch `static`). Only used if this branch is connected to
# Amplify through Git; the research deploys it manually with out.zip instead.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
